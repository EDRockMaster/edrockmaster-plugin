# CI on Gitea Actions (the cluster's runner). The GitHub mirror runs only the Windows build of the
# desktop application (.github/workflows/windows.yml, ADR 0053), whose result the windows job
# below waits for (ADR 0034).
# Release channels (ADR 0012, ADR 0053): the Windows workflow on GitHub packs a tag with Velopack
# and leaves its GitHub release as a draft; this workflow gates merging, then gives the release
# its notes, copies its files to Gitea and publishes it.
# - candidate: a vX.Y.Z-rc.N tag publishes a pre-release, on GitHub for the beta update channel,
#   and on Gitea;
# - production: a vX.Y.Z tag, refused unless a candidate is tagged on the same commit, publishes a
#   release on GitHub, which announces it on Discord (a webhook of the GitHub repository, which
#   ignores pre-releases), and on Gitea.
# The GitHub release needs the GH_RELEASE_TOKEN secret (fine-grained token limited to
# EDRockMaster/edrockmaster-plugin, Contents: write).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # The runner's cache server (actions/cache); uv's own default is GitHub-hosted only
          enable-cache: true
          cache-dependency-glob: uv.lock
          # Our own cache server: keep the downloaded wheels too, not only those built
          prune-cache: false
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run mypy --strict scripts
      - run: uv run lint-imports
      - run: uv run pytest --cov
      - name: Release notes
        run: scripts/release_notes.sh "$(scripts/version.sh)"

  interface:
    # The desktop application's interface (ADR 0021): Node is a build tool, nothing of it ships
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - name: pnpm store path
        id: pnpm
        run: echo "store=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-
      - run: corepack pnpm install --frozen-lockfile
      - name: Bridge types match the schema
        run: corepack pnpm types && git diff --exit-code src/lib/
      - run: corepack pnpm lint
      - run: corepack pnpm check
      - run: corepack pnpm test
      - run: corepack pnpm build
      - name: Licences of what the interface ships
        run: corepack pnpm licenses list --prod

  windows:
    # The Windows build on the GitHub mirror gates merging too (ADR 0034): this waits for the
    # run of the same commit there and takes its result. Required by the protection of main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the ancestors and the base branch decide which run counts
      - name: Windows build on the GitHub mirror
        env:
          GH_ACTIONS_READ_TOKEN: ${{ secrets.GH_ACTIONS_READ_TOKEN }}
          COMMIT: ${{ gitea.event.pull_request.head.sha || gitea.sha }}
          REF: ${{ startsWith(gitea.ref, 'refs/tags/') && gitea.ref_name || '' }}
        run: python3 scripts/windows_build_gate.py "$COMMIT" ${REF:+--ref "$REF"}

  release:
    needs: [test, windows]
    if: startsWith(gitea.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      TAG: ${{ gitea.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags on this commit decide whether production is allowed
      - name: Release plan
        id: plan
        run: |
          python3 scripts/release_plan.py "$TAG" "$(scripts/version.sh)" \
            $(git tag --points-at HEAD) >> "$GITHUB_OUTPUT"
      - name: Release notes
        id: notes
        run: |
          mkdir -p dist
          {
            if [ "${{ steps.plan.outputs.channel }}" = candidate ]; then
              cat <<'EOF_HEAD'
          **Release candidate**, for the testers on the beta update channel: install `EDRockMaster.Companion-beta-Setup.exe`, or choose *Beta* in *Settings*, *Updates*.

          EOF_HEAD
            else
              cat <<'EOF_HEAD'
          Download `EDRockMaster.Companion-stable-Setup.exe` below and run it. Windows may warn about an unknown publisher: *More info*, then *Run anyway*. Once installed, the application updates itself.

          Téléchargez `EDRockMaster.Companion-stable-Setup.exe` ci-dessous et lancez-le. Windows peut avertir d'un éditeur inconnu : *Informations complémentaires*, puis *Exécuter quand même*. Une fois installée, l'application se met à jour d'elle-même.

          EOF_HEAD
            fi
            scripts/release_notes.sh "$(scripts/version.sh)"
          } > dist/release-notes.md
          {
            echo "body<<EOF_NOTES"
            cat dist/release-notes.md
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
      - name: Files of the Windows build
        # A script rather than a marketplace action: under Gitea Actions, GITHUB_API_URL points
        # at Gitea, and JavaScript actions keep that value even when the step overrides it
        run: python3 scripts/github_release.py fetch "$TAG" dist/files
      - name: Gitea release
        uses: akkuman/gitea-release-action@v1
        with:
          name: EDRockMaster ${{ gitea.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.plan.outputs.prerelease }}
          files: dist/files/*
      - name: GitHub release
        run: >
          python3 scripts/github_release.py publish "$TAG" dist/release-notes.md
          ${{ steps.plan.outputs.prerelease == 'true' && '--prerelease' || '--release' }}
