# CI on Gitea Actions (the cluster's runner). The GitHub mirror runs only the Windows build of the
# desktop application (.github/workflows/windows.yml, ADR 0022).
# Release channels (ADR 0012, ADR 0022, ADR 0024): the Windows workflow on GitHub builds the
# packages; this one gates merging and publishes the release notes.
# - candidate: a vX.Y.Z-rc.N tag publishes a private pre-release on Gitea (notes only); its
#   package goes to the Store's testers as a package flight;
# - production: a vX.Y.Z tag, refused unless a candidate is tagged on the same commit, publishes
#   its notes on Gitea and on GitHub, which announces it on Discord (a webhook of the GitHub
#   repository). The GitHub release needs the GH_RELEASE_TOKEN secret (fine-grained token limited
#   to EDRockMaster/edrockmaster-plugin, Contents: write).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run mypy --strict scripts
      - run: uv run lint-imports
      - run: uv run pytest --cov
      - name: Release notes
        run: scripts/release_notes.sh "$(scripts/version.sh)"

  interface:
    # The desktop application's interface (ADR 0021): Node is a build tool, nothing of it ships
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - run: corepack pnpm install --frozen-lockfile
      - name: Bridge types match the schema
        run: corepack pnpm types && git diff --exit-code src/lib/
      - run: corepack pnpm lint
      - run: corepack pnpm check
      - run: corepack pnpm test
      - run: corepack pnpm build
      - name: Licences of what the interface ships
        run: corepack pnpm licenses list --prod

  release:
    needs: test
    if: startsWith(gitea.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      TAG: ${{ gitea.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags on this commit decide whether production is allowed
      - name: Release plan
        id: plan
        run: |
          python3 scripts/release_plan.py "$TAG" "$(scripts/version.sh)" \
            $(git tag --points-at HEAD) >> "$GITHUB_OUTPUT"
      - name: Release notes
        id: notes
        run: |
          mkdir -p dist
          {
            if [ "${{ steps.plan.outputs.channel }}" = candidate ]; then
              printf '**Release candidate**, for acceptance by the testers: not for players.\n\n'
            fi
            scripts/release_notes.sh "$(scripts/version.sh)"
          } > dist/release-notes.md
          {
            echo "body<<EOF_NOTES"
            cat dist/release-notes.md
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
      - name: Gitea release
        uses: akkuman/gitea-release-action@v1
        with:
          name: EDRockMaster ${{ gitea.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.plan.outputs.prerelease }}
      - name: GitHub release
        if: env.GH_RELEASE_TOKEN != '' && steps.plan.outputs.channel == 'production'
        # A script rather than a marketplace action: under Gitea Actions, GITHUB_API_URL points
        # at Gitea, and JavaScript actions keep that value even when the step overrides it
        run: python3 scripts/github_release.py "$TAG" "${{ gitea.sha }}" dist/release-notes.md
