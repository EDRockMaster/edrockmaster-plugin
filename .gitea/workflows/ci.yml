# CI on Gitea Actions (the cluster's runner). The GitHub mirror runs nothing.
# Every run also builds the installable zip, so that packaging is proven before a release.
# On a v* tag, the zip is published as a release on Gitea and on GitHub (public repository,
# where players look for it). The GitHub release needs the GH_RELEASE_TOKEN secret
# (fine-grained token limited to EDRockMaster/edrockmaster-plugin, Contents: write).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run mypy --strict scripts
      - run: uv run pytest --cov
      - name: Package
        run: scripts/package.sh "$(scripts/version.sh)"
      - name: Release notes
        run: scripts/release_notes.sh "$(scripts/version.sh)"

  release:
    needs: test
    if: startsWith(gitea.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      TAG: ${{ gitea.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the version
        run: |
          version="$(scripts/version.sh)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match version $version (pyproject.toml, edrockmaster.VERSION)"
            exit 1
          fi
      - name: Package
        run: scripts/package.sh "${TAG#v}"
      - name: Release notes
        id: notes
        run: |
          scripts/release_notes.sh "${TAG#v}" > dist/release-notes.md
          {
            echo "body<<EOF_NOTES"
            cat dist/release-notes.md
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
      - name: Gitea release
        uses: akkuman/gitea-release-action@v1
        with:
          name: EDRockMaster ${{ gitea.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          files: dist/*.zip
      - name: GitHub release
        if: env.GH_RELEASE_TOKEN != ''
        # A script rather than a marketplace action: under Gitea Actions, GITHUB_API_URL points
        # at Gitea, and JavaScript actions keep that value even when the step overrides it
        run: python3 scripts/github_release.py "$TAG" "${{ gitea.sha }}" dist/release-notes.md dist/*.zip
