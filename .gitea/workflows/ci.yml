# CI on Gitea Actions (the cluster's runner). The GitHub mirror runs only the Windows build of the
# desktop application (.github/workflows/windows.yml, ADR 0022).
# Release channels (ADR 0012, no production without acceptance):
# - dev: every run keeps the installable zip as an artifact;
# - candidate: a vX.Y.Z-rc.N tag publishes a private pre-release on Gitea, for acceptance in game;
# - production: a vX.Y.Z tag, refused unless a candidate is tagged on the same commit, publishes
#   on Gitea and on GitHub (public repository, where players look for it). The GitHub release
#   needs the GH_RELEASE_TOKEN secret (fine-grained token limited to
#   EDRockMaster/edrockmaster-plugin, Contents: write).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run mypy --strict scripts
      - run: uv run lint-imports
      - run: uv run pytest --cov
      - name: Package
        # A dev build, named after its commit (ADR 0016)
        run: scripts/package.sh "$(scripts/version.sh)-dev+$(git rev-parse --short=7 HEAD)" dev
      - name: Release notes
        run: scripts/release_notes.sh "$(scripts/version.sh)"
      - name: Keep the dev build
        # v4 refuses any server but github.com (it takes Gitea for GitHub Enterprise): v3 works
        uses: actions/upload-artifact@v3
        with:
          name: EDRockMaster-dev-${{ gitea.sha }}
          path: dist/*.zip
          retention-days: 14

  interface:
    # The desktop application's interface (ADR 0021): Node is a build tool, nothing of it ships
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
      - run: corepack pnpm install --frozen-lockfile
      - name: Bridge types match the schema
        run: corepack pnpm types && git diff --exit-code src/lib/
      - run: corepack pnpm lint
      - run: corepack pnpm check
      - run: corepack pnpm test
      - run: corepack pnpm build
      - name: Licences of what the interface ships
        run: corepack pnpm licenses list --prod

  release:
    needs: test
    if: startsWith(gitea.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
      TAG: ${{ gitea.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the tags on this commit decide whether production is allowed
      - name: Release plan
        id: plan
        run: |
          python3 scripts/release_plan.py "$TAG" "$(scripts/version.sh)" \
            $(git tag --points-at HEAD) >> "$GITHUB_OUTPUT"
      - name: Package
        run: scripts/package.sh "${TAG#v}" "${{ steps.plan.outputs.channel }}"
      - name: Release notes
        id: notes
        run: |
          {
            if [ "${{ steps.plan.outputs.channel }}" = candidate ]; then
              printf '**Release candidate**, for acceptance in game: not for players.\n\n'
            fi
            scripts/release_notes.sh "$(scripts/version.sh)"
          } > dist/release-notes.md
          {
            echo "body<<EOF_NOTES"
            cat dist/release-notes.md
            echo "EOF_NOTES"
          } >> "$GITHUB_OUTPUT"
      - name: Gitea release
        uses: akkuman/gitea-release-action@v1
        with:
          name: EDRockMaster ${{ gitea.ref_name }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.plan.outputs.prerelease }}
          files: dist/*.zip
      - name: GitHub release
        if: env.GH_RELEASE_TOKEN != '' && steps.plan.outputs.channel == 'production'
        # A script rather than a marketplace action: under Gitea Actions, GITHUB_API_URL points
        # at Gitea, and JavaScript actions keep that value even when the step overrides it
        run: python3 scripts/github_release.py "$TAG" "${{ gitea.sha }}" dist/release-notes.md dist/*.zip
