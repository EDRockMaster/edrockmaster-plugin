# Windows build of the desktop application (ADR 0020, ADR 0053). PyInstaller does not cross-compile:
# this runs on GitHub Actions (windows-latest), on the public GitHub mirror only. Gitea reads
# .gitea/workflows, which runs the checks and gates merging, and ignores this folder.
#
# - every push of a branch that changes more than the documentation: the application, its smoke
#   tests and the update test (installed by Velopack, then updated to a newer version); the
#   portable zip, kept 14 days; a newer push to the same branch cancels the older build;
# - a tag vX.Y.Z-rc.N or vX.Y.Z, refused by the release plan as on Gitea (no production without a
#   candidate on the commit): packed with Velopack for its update channels, then left on GitHub as
#   a draft release, which the Gitea CI fetches, completes and publishes.
name: Windows build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    # Documentation alone builds nothing; GitHub never applies path filters to tags
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitea/**"
  workflow_dispatch:

# A tag's build is never cancelled: it makes the tag's release
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.plan.outputs.build_version }}
      channels: ${{ steps.plan.outputs.channels }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      vpk: ${{ steps.vpk.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags on this commit decide whether production is allowed
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
      - name: pnpm store path
        id: pnpm
        working-directory: web
        run: echo "store=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: pnpm store cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Interface
        working-directory: web
        run: |
          corepack pnpm install --frozen-lockfile
          corepack pnpm build

      - run: uv sync --locked
      - name: Tests on Windows
        run: uv run pytest

      - name: Release plan
        id: plan
        run: |
          version="$(scripts/version.sh)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            uv run python scripts/release_plan.py "$GITHUB_REF_NAME" "$version" \
              $(git tag --points-at HEAD) >> "$GITHUB_OUTPUT"
            echo "build_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
            echo "build_version=$version-dev+$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package
        run: >
          uv run python scripts/package_desktop.py
          "${{ steps.plan.outputs.build_version }}"
          "${{ steps.plan.outputs.channel }}"
          dist-desktop

      - name: Smoke test
        # The packaged application starts, shows its interface (WebView2, the page, the bridge)
        # and reads a recorded journal, with no error in its log
        run: |
          journal="$RUNNER_TEMP/journal"
          mkdir -p "$journal"
          uv run python scripts/fixture_to_journal.py \
            tests/fixtures/engineering-power-distributor-2026-10-08.jsonl "$journal"
          export EDROCKMASTER_JOURNAL_DIR="$(cygpath -w "$journal")"
          ./dist-desktop/pyinstaller/EDRockMaster/EDRockMaster.exe &
          log="$(cygpath -u "$LOCALAPPDATA")/EDRockMaster/logs/edrockmaster.log"
          for _ in $(seq 1 60); do
            grep -q "The interface is ready" "$log" 2>/dev/null && break
            sleep 1
          done
          sleep 3
          taskkill //F //IM EDRockMaster.exe || true
          cat "$log"
          grep -q "Reading the journal from Journal.2026-10-08T014139.01.log" "$log"
          grep -q "The interface is ready" "$log"
          ! grep -E "ERROR|Traceback" "$log"

      - name: Smoke test of the demo
        # The demo journal is packaged, and read instead of the player's
        run: |
          ./dist-desktop/pyinstaller/EDRockMaster/EDRockMaster.exe --demo &
          log="$(cygpath -u "$LOCALAPPDATA")/EDRockMaster/logs/edrockmaster.log"
          for _ in $(seq 1 60); do
            [ "$(grep -c "The interface is ready" "$log")" -ge 2 ] && break
            sleep 1
          done
          sleep 3
          taskkill //F //IM EDRockMaster.exe || true
          cat "$log"
          grep -q "Demo mode (.*): a sample journal" "$log"
          [ "$(grep -c "Reading the journal from Journal." "$log")" -ge 2 ]
          [ "$(grep -c "The interface is ready" "$log")" -ge 2 ]
          ! grep -E "ERROR|Traceback" "$log"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Velopack
        id: vpk
        # vpk's version must be the library's (ADR 0053)
        run: |
          version="$(uv run python -c 'import importlib.metadata as m; print(m.version("velopack"))')"
          dotnet tool install --global vpk --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update test
        # Installed by Velopack's installer, the application finds a newer version in a local
        # feed, downloads it, and has it applied once its window is closed; the uninstall then
        # leaves the player's data (ADR 0053). The same build, packed as 1.0.0 then as 1.0.1, on
        # the channel it follows: its first update channel for a tag (beta for a candidate,
        # stable for a production), the one it was packed for otherwise.
        run: |
          feed="$RUNNER_TEMP/feed"
          channels="${{ steps.plan.outputs.channels }}"
          channel="${channels%% *}"
          channel="${channel:-test}"
          pack() {
            # The hooks run from Python (velopack.App().run()), which vpk cannot see in the
            # executable: this test is what checks them
            vpk pack --packId EDRockMaster.Companion --packVersion "$1" --channel "$channel" \
              --packTitle "EDRockMaster Companion" --packAuthors DamScan \
              --packDir dist-desktop/pyinstaller/EDRockMaster --mainExe EDRockMaster.exe \
              --icon dist-desktop/assets/EDRockMaster.ico --runtime win-x64 \
              --skipVeloAppCheck --outputDir "$feed"
          }
          pack 1.0.0
          cp "$feed/EDRockMaster.Companion-$channel-Setup.exe" "$RUNNER_TEMP/setup-1.0.0.exe"
          pack 1.0.1
          local_app_data="$(cygpath -u "$LOCALAPPDATA")"
          data="$local_app_data/EDRockMaster"
          installed="$local_app_data/EDRockMaster.Companion"
          mkdir -p "$data"
          echo kept > "$data/update-test.txt"
          "$RUNNER_TEMP/setup-1.0.0.exe" --silent # installs without starting the application
          ls "$installed" "$installed/current"
          grep -q "<version>1.0.0</version>" "$installed/current/sq.version"
          log="$data/logs/edrockmaster.log"
          EDROCKMASTER_UPDATE_SOURCE="$(cygpath -w "$feed")" "$installed/current/EDRockMaster.exe" &
          for _ in $(seq 1 120); do
            grep -q "Update 1.0.1 downloaded" "$log" 2>/dev/null && break
            sleep 1
          done
          grep -q "Update 1.0.1 downloaded" "$log"
          # Closes the window, as the player would: the version ready is applied once it has quit
          taskkill //IM EDRockMaster.exe
          for _ in $(seq 1 120); do
            grep -q "<version>1.0.1</version>" "$installed/current/sq.version" 2>/dev/null && break
            sleep 1
          done
          tail -n 20 "$log"
          grep -q "<version>1.0.1</version>" "$installed/current/sq.version"
          ! grep -E "ERROR|Traceback" "$log"
          "$installed/Update.exe" uninstall --silent
          for _ in $(seq 1 60); do
            [ ! -e "$installed/current" ] && break
            sleep 1
          done
          [ ! -e "$installed/current" ]
          [ "$(cat "$data/update-test.txt")" = kept ]

      - name: Pack the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for channel in ${{ steps.plan.outputs.channels }}; do
            # The channel's latest release, for the delta; none before the channel's first one
            pre=""
            [ "$channel" = beta ] && pre="--pre"
            vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" \
              --channel "$channel" $pre --token "$GH_TOKEN" --outputDir releases \
              || echo "No earlier release on the $channel channel"
            vpk pack --packId EDRockMaster.Companion \
              --packVersion "${{ steps.plan.outputs.build_version }}" --channel "$channel" \
              --packTitle "EDRockMaster Companion" --packAuthors DamScan \
              --packDir dist-desktop/pyinstaller/EDRockMaster --mainExe EDRockMaster.exe \
              --icon dist-desktop/assets/EDRockMaster.ico --runtime win-x64 \
              --skipVeloAppCheck --outputDir releases
          done

      - name: Keep the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: EDRockMaster-release-${{ steps.plan.outputs.build_version }}
          path: releases/
          retention-days: 14
          if-no-files-found: error

      - name: Keep the application
        uses: actions/upload-artifact@v7
        with:
          name: EDRockMaster-windows-${{ steps.plan.outputs.build_version }}
          path: dist-desktop/*.zip
          retention-days: 14
          if-no-files-found: error

  release:
    # The tag's release, left as a draft with what Velopack made, for each channel: the Gitea CI
    # gives it its notes and publishes it (ADR 0053)
    needs: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: EDRockMaster-release-${{ needs.windows.outputs.version }}
          path: releases
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet tool install --global vpk --version "${{ needs.windows.outputs.vpk }}"
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          [ "${{ needs.windows.outputs.prerelease }}" = true ] && pre="--pre"
          for channel in ${{ needs.windows.outputs.channels }}; do
            vpk upload github --repoUrl "https://github.com/$GITHUB_REPOSITORY" \
              --token "$GH_TOKEN" --outputDir releases --channel "$channel" \
              --tag "$GITHUB_REF_NAME" --releaseName "EDRockMaster $GITHUB_REF_NAME" \
              --targetCommitish "$GITHUB_SHA" --merge $pre
          done
