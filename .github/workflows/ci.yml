name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p dist/EDRockMaster
          cp -r load.py mining LICENSE README.md dist/EDRockMaster/
          cd dist && zip -r EDRockMaster-${GITHUB_REF_NAME}.zip EDRockMaster
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
