[project]
name = "edrockmaster-plugin"
version = "0.3.0"
description = "EDMC plugin for EDRockMaster"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
# EDMC bundles its own runtime: the plugin must not need any third-party package.
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.15",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "PT", "N"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]
# Hook signatures are imposed by EDMC
"load.py" = ["PLR0913", "PLR0917"]
"edrockmaster/edmc/plugin.py" = ["PLR0913", "PLR0917"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["edrockmaster", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
source = [
    "edrockmaster/domain",
    "edrockmaster/application",
    "edrockmaster/ui",
    "edrockmaster/desktop",
]
# tkinter widgets: tested only where a display exists (not in CI), kept thin
omit = ["edrockmaster/ui/panel.py", "edrockmaster/ui/preferences.py"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.importlinter]
root_package = "edrockmaster"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core depends on no adapter, no host and no interface toolkit (ADR 0020)"
type = "forbidden"
source_modules = ["edrockmaster.domain", "edrockmaster.application"]
forbidden_modules = [
    "edrockmaster.infrastructure",
    "edrockmaster.edmc",
    "edrockmaster.desktop",
    "edrockmaster.ui",
    "tkinter",
    "webview",
    "sqlite3",
]

[[tool.importlinter.contracts]]
name = "The domain depends on nothing else of the plugin"
type = "forbidden"
source_modules = ["edrockmaster.domain"]
forbidden_modules = ["edrockmaster.application"]
