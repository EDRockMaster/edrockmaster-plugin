[project]
name = "edrockmaster-plugin"
version = "0.2.0"
description = "EDMC plugin for EDRockMaster"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
# EDMC bundles its own runtime: the plugin must not need any third-party package.
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "PT", "N"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]
# Hook signatures are imposed by EDMC
"load.py" = ["PLR0913", "PLR0917"]
"edrockmaster/edmc/plugin.py" = ["PLR0913", "PLR0917"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["edrockmaster", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["edrockmaster/domain", "edrockmaster/application", "edrockmaster/ui"]
# tkinter widgets: tested only where a display exists (not in CI), kept thin
omit = ["edrockmaster/ui/panel.py", "edrockmaster/ui/preferences.py"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
