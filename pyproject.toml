[project]
name = "edrockmaster-plugin"
version = "0.4.0"
description = "EDRockMaster desktop application (ADR 0020, ADR 0024)"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
# The application's dependencies are in the desktop group, which uv installs by default
dependencies = []

[dependency-groups]
desktop = [
    "pywebview>=6.2.1",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.15",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20261006",
]
packaging = [
    "pillow>=12.3.0",
    "pyinstaller>=6.22.3",
]

[tool.uv]
package = false
# The desktop application's dependencies (ADR 0020), its tools and its packaging
default-groups = ["dev", "desktop", "packaging"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL", "PT", "N"]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0913"]

[tool.mypy]
strict = true
python_version = "3.13"
packages = ["edrockmaster", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.coverage.run]
source = [
    "edrockmaster/domain",
    "edrockmaster/application",
    "edrockmaster/ui",
    "edrockmaster/desktop",
]
omit = [
    # python -m edrockmaster.desktop: calls main() of window.py, which is tested
    "edrockmaster/desktop/__main__.py",
]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.importlinter]
root_package = "edrockmaster"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The core depends on no adapter, no host and no interface toolkit (ADR 0020)"
type = "forbidden"
source_modules = ["edrockmaster.domain", "edrockmaster.application"]
forbidden_modules = [
    "edrockmaster.infrastructure",
    "edrockmaster.desktop",
    "edrockmaster.ui",
    "webview",
    "sqlite3",
]

[[tool.importlinter.contracts]]
name = "Presenters and adapters know nothing of the window (ADR 0020)"
type = "forbidden"
source_modules = ["edrockmaster.ui", "edrockmaster.infrastructure"]
forbidden_modules = ["edrockmaster.desktop", "webview", "tkinter"]

[[tool.importlinter.contracts]]
name = "The domain depends on nothing else of the application"
type = "forbidden"
source_modules = ["edrockmaster.domain"]
forbidden_modules = ["edrockmaster.application"]
