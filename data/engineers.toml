# Where the engineers are and how to unlock them, written by the project (ADR 0031).
#
# Read by scripts/import_engineering_data.py, which writes them into catalogue.json by engineer
# id. One entry per engineer, by name as FDevIDs' engineers.csv writes it.
#
# - `system`, `base`: as the game names them.
# - `referred_by`: the engineers who make this one known; none, known from the start. A ship
#   engineer refers the next once the player reaches grade 3 with them; an on-foot engineer,
#   once the player has done their `referral` task.
# - `invitation`: what makes the engineer invite the player (ship engineers only);
#   `unlock`: what to deliver or do. In English, in the project's own words: facts and figures
#   only, no text taken from a source. Translated in L10n/fr.strings.
# - `confidence`, as for the recipes (ADR 0030): "game" (read in game, `read` its date) or
#   "web" (`sources` and `read`). The game wins; when sources disagree, the most recent wins.
#
# The game confirmed two bases, the player having docked there (journal `Docked`, its market id
# that of FDevIDs): Qwent Research Base in Sirius (2026-10-08) and The Jackrabbit in Orishis
# (2026-10-11).

[sources]
ship = [
    "https://edfieldmanual.com/wiki/Engineers (updated 2026-09-10)",
    "https://edblackbox.com/guides/engineering/engineering-manuals/checklist.html (updated 2026-07-01)",
]
on_foot = "https://edfieldmanual.com/wiki/<engineer> (updated 2026-09-11 to 2026-09-12)"

